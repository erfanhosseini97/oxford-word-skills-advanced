<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced English Flashcards</title>
<style>
:root {
  --purple: #6558d9;
  --dark: #242442;
  --muted: #777991;
  --bg: #f5f5fc;
  --mint: #d5f5e8;
  --peach: #ffe3d5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 15px;
  display: grid;
  place-items: center;
  font-family: system-ui, -apple-system, sans-serif;
  color: var(--dark);
  background:
    radial-gradient(circle at 5% 5%, var(--mint), transparent 28%),
    radial-gradient(circle at 95% 15%, var(--peach), transparent 30%),
    var(--bg);
}
.app { width: min(100%, 680px); }
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 48px; height: 48px;
  display: grid; place-items: center;
  border-radius: 16px; color: white;
  font-weight: 900; font-size: 21px;
  background: linear-gradient(135deg, #6558d9, #b28af5);
}
h1 { font-size: clamp(20px, 4vw, 28px); margin: 0; }
.subtitle { color: var(--muted); margin: 4px 0 0; font-size: 13px; }
.counter {
  padding: 9px 12px; border-radius: 30px;
  background: white; font-size: 13px; white-space: nowrap;
}
.progress {
  height: 7px; background: #e3e3f0;
  border-radius: 20px; overflow: hidden; margin-bottom: 20px;
}
#bar {
  height: 100%; width: 0;
  background: linear-gradient(90deg, #6558d9, #b28af5);
  transition: width .3s;
}
.card-scene { perspective: 1000px; }
.card {
  width: 100%; min-height: 365px;
  position: relative; cursor: pointer;
  transform-style: preserve-3d;
  transition: transform .55s;
  border: 0; background: transparent;
  color: inherit; padding: 0; text-align: center;
}
.card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0;
  min-height: 365px; padding: 28px 22px;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  gap: 16px; overflow-wrap: anywhere;
  border-radius: 28px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 18px 45px #28264a16;
  background: linear-gradient(145deg, white, #f2efff);
  overflow: hidden;
}
.face::before {
  content: ""; position: absolute;
  width: 170px; height: 170px;
  background: #d5f5e877; border-radius: 50%;
  top: -100px; right: -50px;
}
.face > * { position: relative; }
.back {
  transform: rotateY(180deg);
  background: linear-gradient(145deg, white, #eafaf3);
}
.tag {
  color: var(--purple); font-size: 12px;
  font-weight: 800; letter-spacing: 2px;
  text-transform: uppercase;
}
.word {
  font-size: clamp(25px, 5vw, 39px);
  font-weight: 850; line-height: 1.25;
}
.pron { color: var(--muted); font-size: 15px; }
.hint { color: var(--muted); font-size: 13px; }
.meaning { font-size: 20px; font-weight: 750; line-height: 1.7; }
.example { font-size: 16px; line-height: 1.65; }
.translation { color: var(--muted); font-size: 14px; line-height: 1.6; }
.controls {
  display: flex; gap: 9px; margin-top: 20px;
}
button.action {
  border: 0; border-radius: 13px; padding: 13px 15px;
  font: inherit; font-weight: 750; cursor: pointer;
  background: white; color: var(--dark);
  box-shadow: 0 4px 14px #28264a0c;
}
button.action:active { transform: scale(.97); }
button.primary { color: white; background: var(--purple); }
.grow { flex: 1; }
.status {
  display: flex; justify-content: space-between;
  gap: 12px; align-items: center;
  margin-top: 17px; color: var(--muted); font-size: 13px;
}
.status label { display: flex; align-items: center; gap: 7px; }
input[type="checkbox"] { accent-color: var(--purple); }
.footer {
  margin-top: 25px; text-align: center;
  color: var(--muted); font-size: 12px; line-height: 1.8;
}
@media(max-width:480px) {
  body { padding: 17px 12px; }
  .face, .card { min-height: 390px; }
  .face { padding: 22px 17px; }
  .controls { gap: 6px; }
  button.action { padding: 12px 9px; font-size: 13px; }
  .status { align-items: flex-start; flex-direction: column; }
}
@media(prefers-reduced-motion:reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <div class="logo">Aa</div>
      <div>
        <h1>Advanced English</h1>
        <p class="subtitle">Vocabulary Flashcards · Learn & Remember</p>
      </div>
    </div>
    <div class="counter" id="counter">1 / 12</div>
  </header>

  <div class="progress"><div id="bar"></div></div>

  <div class="card-scene">
    <button class="card" id="card" aria-label="Flip flashcard">
      <div class="face front">
        <span class="tag">English · Front</span>
        <span class="word" id="word"></span>
        <span class="pron" id="pron"></span>
        <span class="hint">Think of the meaning, then tap to reveal ↻</span>
      </div>
      <div class="face back">
        <span class="tag">Meaning · Example</span>
        <span class="word" id="backWord" style="font-size:23px"></span>
        <span class="meaning" id="meaning"></span>
        <span class="example" id="example"></span>
        <span class="translation" id="translation"></span>
      </div>
    </button>
  </div>

  <div class="controls">
    <button class="action" id="prev">← Previous</button>
    <button class="action primary grow" id="flip">Show Answer</button>
    <button class="action" id="next">Next →</button>
  </div>

  <div class="status">
    <label><input type="checkbox" id="known"> I know this card ✓</label>
    <span id="score">0 cards mastered</span>
  </div>

  <div class="footer">
    Recall first. Reveal second. Repeat tomorrow.<br>
    Works offline · No account required
  </div>
</main>

<script>
const cards = [
{
word:"Crawl", pron:"/krɔːl/",
meaning:"به‌کندی حرکت کردن؛ سینه‌خیز رفتن",
example:"Traffic was crawling along the motorway.",
translation:"ترافیک در بزرگراه به‌کندی حرکت می‌کرد."
},
{
word:"Have second thoughts", pron:"/hæv ˌsekənd ˈθɔːts/",
meaning:"دچار تردید شدن؛ در تصمیم تجدیدنظر کردن",
example:"I'm having second thoughts about buying that car.",
translation:"درباره خرید آن ماشین دچار تردید شده‌ام."
},
{
word:"Be in two minds about something", pron:"/biː ɪn tuː maɪndz/",
meaning:"درباره چیزی دودل بودن",
example:"I'm in two minds about accepting the offer.",
translation:"درباره پذیرفتن پیشنهاد دودلم."
},
{
word:"Sweet of somebody", pron:"/swiːt əv ˈsʌmbədi/",
meaning:"از کسی مهربانانه بودن؛ لطف کسی بودن",
example:"It was sweet of you to remember my birthday.",
translation:"لطف کردی که تولدم را به یاد داشتی."
},
{
word:"Be tied up", pron:"/biː taɪd ʌp/",
meaning:"گرفتار و مشغول بودن",
example:"Sorry, I can't talk. I'm tied up at work.",
translation:"ببخشید، نمی‌توانم صحبت کنم؛ سر کار گرفتارم."
},
{
word:"Dawn on somebody", pron:"/dɔːn ɒn ˈsʌmbədi/",
meaning:"به ذهن کسی رسیدن؛ ناگهان متوجه شدن",
example:"It suddenly dawned on me that I'd forgotten my keys.",
translation:"ناگهان متوجه شدم که کلیدهایم را فراموش کرده‌ام."
},
{
word:"Ulterior motive", pron:"/ʌlˌtɪəriə ˈməʊtɪv/",
meaning:"انگیزه پنهانی؛ هدفی غیر از دلیل ظاهری",
example:"I think he has an ulterior motive for helping us.",
translation:"فکر می‌کنم او برای کمک به ما انگیزه پنهانی دارد."
},
{
word:"Thick", pron:"/θɪk/",
meaning:"در انگلیسی بریتانیایی غیررسمی: کم‌هوش یا دیر‌فهم؛ گاهی توهین‌آمیز",
example:"He's a bit thick sometimes, but he's kind.",
translation:"گاهی کمی دیر‌فهم است، اما مهربان است."
},
{
word:"Be the last thing on somebody's mind", pron:"/biː ðə lɑːst θɪŋ ɒn ... maɪnd/",
meaning:"اصلاً در فکر کسی نبودن؛ آخرین چیزی بودن که به ذهنش می‌رسد",
example:"Money was the last thing on her mind.",
translation:"پول اصلاً در فکر او نبود."
},
{
word:"Get out of something", pron:"/ɡet aʊt əv ˈsʌmθɪŋ/",
meaning:"از تعهد یا موقعیتی خلاص شدن؛ از زیر چیزی در رفتن",
example:"He's trying to get out of his contract.",
translation:"او تلاش می‌کند از قراردادش خلاص شود."
},
{
word:"Send something or somebody flying", pron:"/send ... ˈflaɪɪŋ/",
meaning:"چیزی یا کسی را با شدت به هوا پرتاب کردن",
example:"He slammed the door and sent the papers flying.",
translation:"در را محکم کوبید و کاغذها را به هوا پرتاب کرد."
},
{
word:"You are not gonna believe this!", pron:"/juː ɑː nɒt ˈɡɒnə bɪˈliːv ðɪs/",
meaning:"باورت نمی‌شود!؛ باورت نمی‌شه!",
example:"You are not gonna believe this! I won the competition!",
translation:"باورت نمی‌شه! توی مسابقه برنده شدم!"
}
];

let index = 0;
let flipped = false;
const mastered = new Set();
const $ = id => document.getElementById(id);

function render() {
  const c = cards[index];
  $("word").textContent = c.word;
  $("pron").textContent = c.pron;
  $("backWord").textContent = c.word;
  $("meaning").textContent = c.meaning;
  $("example").textContent = c.example;
  $("translation").textContent = c.translation;
  $("card").classList.toggle("flipped", flipped);
  $("counter").textContent = `${index + 1} / ${cards.length}`;
  $("bar").style.width = `${(index + 1) / cards.length * 100}%`;
  $("flip").textContent = flipped ? "Show English" : "Show Answer";
  $("known").checked = mastered.has(index);
  $("score").textContent = `${mastered.size} of ${cards.length} cards mastered`;
}
function flip() { flipped = !flipped; render(); }
function move(step) {
  index = (index + step + cards.length) % cards.length;
  flipped = false;
  render();
}
$("card").addEventListener("click", flip);
$("flip").addEventListener("click", flip);
$("prev").addEventListener("click", () => move(-1));
$("next").addEventListener("click", () => move(1));
$("known").addEventListener("change", e => {
  if (e.target.checked) mastered.add(index);
  else mastered.delete(index);
  render();
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "ArrowRight") move(1);
  if (e.code === "ArrowLeft") move(-1);
  if (e.code === "Space") {
    e.preventDefault();
    flip();
  }
});
render();
</script>
</body>
</html>
